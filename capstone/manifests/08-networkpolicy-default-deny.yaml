# Baseline: deny all ingress and egress to every pod in the namespace,
# then explicitly allow only what's needed (see the other netpol files).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: capstone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
