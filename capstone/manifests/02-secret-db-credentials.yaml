# Generate with: kubectl create secret generic db-credentials -n capstone \
#   --from-literal=DB_USER=notesapp --from-literal=DB_PASS=<your-own-password> \
#   --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: capstone
type: Opaque
stringData:
  DB_USER: notesapp
  DB_PASS: change-me-before-applying
