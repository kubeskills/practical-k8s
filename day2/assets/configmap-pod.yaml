apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
  - name: demo
    image: busybox
    command: ["sh", "-c", "echo $WELCOME_MSG && echo API_KEY=$API_KEY && sleep 3600"]
    envFrom:
    - configMapRef:
        name: web-config
    env:
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: web-secret
          key: API_KEY
