apiVersion: v1
kind: Pod
metadata:
  name: api-client
spec:
  serviceAccountName: monitoring-agent   # use this SA instead of default
  automountServiceAccountToken: true     # default true; set false if pod doesn't need API access
  containers:
  - name: client
    image: curlimages/curl
    command: ["sh", "-c", "sleep 3600"]
