apiVersion: v1
kind: Pod
metadata:
  name: secure-app
spec:
  # Pod-level SecurityContext — applies to all containers
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000        # volume ownership
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: myapp:latest
    # Container-level SecurityContext — overrides pod-level per container
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        add: ["NET_BIND_SERVICE"]
