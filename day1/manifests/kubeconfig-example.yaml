# Example kubeconfig structure — reference only, not applied with kubectl apply
# Location on control plane: /etc/kubernetes/admin.conf
# Copy to local machine: scp root@<cp-ip>:/etc/kubernetes/admin.conf ~/.kube/config

apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: <base64-encoded ca.crt>
    server: https://<control-plane-ip>:6443
  name: kubernetes
users:
- name: kubernetes-admin
  user:
    client-certificate-data: <base64-encoded client.crt>
    client-key-data: <base64-encoded client.key>
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
