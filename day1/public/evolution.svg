<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="trad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="virt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cont" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Traditional -->
  <g transform="translate(20, 60)">
    <text x="130" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#475569">Traditional</text>
    <rect x="0" y="0" width="260" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Hardware</text>
    <rect x="0" y="70" width="260" height="50" rx="6" fill="url(#trad)" stroke="#475569" stroke-width="2"/>
    <text x="130" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="600">Operating System</text>
    <rect x="10" y="135" width="72" height="55" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <text x="46" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#78350f" font-weight="600">App A</text>
    <rect x="94" y="135" width="72" height="55" rx="6" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
    <text x="130" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7c2d12" font-weight="600">App B</text>
    <rect x="178" y="135" width="72" height="55" rx="6" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <text x="214" y="167" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f1d1d" font-weight="600">App C</text>
    <text x="130" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Apps compete for resources</text>
    <text x="130" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">No isolation between apps</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(305, 160)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="40,-6 52,0 40,6" fill="#94a3b8"/>
  </g>

  <!-- Virtualized -->
  <g transform="translate(350, 60)">
    <text x="130" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">Virtualized</text>
    <rect x="0" y="0" width="260" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Hardware</text>
    <rect x="0" y="70" width="260" height="40" rx="6" fill="url(#virt)" stroke="#1d4ed8" stroke-width="2"/>
    <text x="130" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="600">Hypervisor</text>
    <!-- VM 1 -->
    <rect x="10" y="120" width="115" height="100" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="20" y="130" width="95" height="30" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="67" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">Guest OS</text>
    <rect x="20" y="170" width="42" height="36" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="41" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f" font-weight="600">A</text>
    <rect x="72" y="170" width="42" height="36" rx="4" fill="#fb923c" stroke="#ea580c" stroke-width="1.5"/>
    <text x="93" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7c2d12" font-weight="600">B</text>
    <text x="67" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">VM 1</text>
    <!-- VM 2 -->
    <rect x="135" y="120" width="115" height="100" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <rect x="145" y="130" width="95" height="30" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="192" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">Guest OS</text>
    <rect x="157" y="170" width="72" height="36" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
    <text x="193" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d" font-weight="600">C</text>
    <text x="192" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">VM 2</text>
    <text x="130" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Full isolation, heavy overhead</text>
    <text x="130" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Each VM has its own OS</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(635, 160)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="40,-6 52,0 40,6" fill="#94a3b8"/>
  </g>

  <!-- Containers -->
  <g transform="translate(680, 60)">
    <text x="130" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#059669">Containers</text>
    <rect x="0" y="0" width="260" height="60" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Hardware</text>
    <rect x="0" y="70" width="260" height="40" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="130" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="white" font-weight="600">Host OS</text>
    <rect x="0" y="120" width="260" height="35" rx="6" fill="url(#cont)" stroke="#047857" stroke-width="2"/>
    <text x="130" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Container Runtime</text>
    <rect x="10" y="168" width="55" height="50" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <text x="37" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#78350f" font-weight="600">A</text>
    <rect x="73" y="168" width="55" height="50" rx="6" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
    <text x="100" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7c2d12" font-weight="600">B</text>
    <rect x="136" y="168" width="55" height="50" rx="6" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <text x="163" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d" font-weight="600">C</text>
    <rect x="199" y="168" width="55" height="50" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
    <text x="226" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4c1d95" font-weight="600">D</text>
    <text x="130" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Shared kernel, lightweight</text>
    <text x="130" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">100s-1000s per host</text>
  </g>
</svg>
