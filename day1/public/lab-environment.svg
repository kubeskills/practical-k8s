<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cpNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wkNode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cloud background -->
  <rect x="20" y="20" width="760" height="400" rx="20" fill="url(#cloudGrad)" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1e40af">Linode (Akamai Cloud)</text>

  <!-- Control Plane Node -->
  <rect x="260" y="80" width="280" height="140" rx="14" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="260" y="80" width="280" height="38" rx="14" fill="url(#cpNode)"/>
  <rect x="260" y="106" width="280" height="12" fill="url(#cpNode)"/>
  <text x="400" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Control Plane</text>

  <text x="290" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Ubuntu 24.04 LTS</text>
  <text x="290" y="162" font-family="system-ui, sans-serif" font-size="13" fill="#475569">4 GB RAM  |  2 vCPU</text>
  <text x="290" y="182" font-family="system-ui, sans-serif" font-size="13" fill="#475569">API Server, etcd, Scheduler</text>
  <text x="290" y="202" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Controller Manager</text>

  <!-- Connection lines -->
  <line x1="360" y1="220" x2="260" y2="280" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8,4"/>
  <line x1="480" y1="220" x2="620" y2="280" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8,4"/>

  <!-- Worker Node 1 -->
  <rect x="120" y="280" width="280" height="120" rx="14" fill="white" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="120" y="280" width="280" height="36" rx="14" fill="url(#wkNode)"/>
  <rect x="120" y="304" width="280" height="12" fill="url(#wkNode)"/>
  <text x="260" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">Worker Node</text>
  <text x="150" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Ubuntu 24.04 LTS</text>
  <text x="150" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#475569">4 GB RAM  |  2 vCPU</text>
  <text x="150" y="378" font-family="system-ui, sans-serif" font-size="12" fill="#475569">kubelet, kube-proxy, containerd</text>

  <!-- Your laptop -->
  <rect x="500" y="280" width="240" height="120" rx="14" fill="white" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="500" y="280" width="240" height="36" rx="14" fill="#f59e0b"/>
  <rect x="500" y="304" width="240" height="12" fill="#f59e0b"/>
  <text x="620" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">Your Laptop</text>
  <text x="530" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#475569">SSH client</text>
  <text x="530" y="358" font-family="system-ui, sans-serif" font-size="12" fill="#475569">kubectl</text>
  <text x="530" y="378" font-family="system-ui, sans-serif" font-size="12" fill="#475569">kubeconfig</text>

  <!-- SSH arrow from laptop to CP -->
  <line x1="620" y1="280" x2="520" y2="195" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="585" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#d97706" font-weight="600">SSH</text>
</svg>
