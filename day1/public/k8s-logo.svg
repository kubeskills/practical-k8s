<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326ce5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2855b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Kubernetes helm wheel - simplified -->
  <g transform="translate(100,100)">
    <!-- Outer heptagonal shape -->
    <polygon points="0,-85 57,-63 78,-8 57,50 0,78 -57,50 -78,-8 -57,-63"
      fill="url(#bg)" stroke="white" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inner white spokes -->
    <g fill="none" stroke="white" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-42" x2="0" y2="-60"/>
      <line x1="40" y1="-13" x2="55" y2="-20"/>
      <line x1="24" y1="34" x2="35" y2="50"/>
      <line x1="-24" y1="34" x2="-35" y2="50"/>
      <line x1="-40" y1="-13" x2="-55" y2="-20"/>
    </g>
    <!-- Spoke endpoints (dots) -->
    <g fill="white">
      <circle cx="0" cy="-62" r="6"/>
      <circle cx="57" cy="-22" r="6"/>
      <circle cx="37" cy="52" r="6"/>
      <circle cx="-37" cy="52" r="6"/>
      <circle cx="-57" cy="-22" r="6"/>
    </g>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="14" fill="white"/>
    <circle cx="0" cy="0" r="8" fill="url(#bg)"/>
    <!-- Inner spokes from center -->
    <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-14" x2="0" y2="-42"/>
      <line x1="13" y1="-4" x2="40" y2="-13"/>
      <line x1="8" y1="11" x2="24" y2="34"/>
      <line x1="-8" y1="11" x2="-24" y2="34"/>
      <line x1="-13" y1="-4" x2="-40" y2="-13"/>
    </g>
  </g>
</svg>
