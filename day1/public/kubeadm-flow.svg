<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">kubeadm init — What Happens</text>

  <!-- Step 1 -->
  <rect x="30" y="60" width="220" height="70" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="55" cy="80" r="14" fill="url(#stepGrad)"/>
  <text x="55" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
  <text x="80" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Pre-flight checks</text>
  <text x="55" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Validates system readiness</text>

  <!-- Arrow -->
  <line x1="250" y1="95" x2="280" y2="95" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="280,89 292,95 280,101" fill="#cbd5e1"/>

  <!-- Step 2 -->
  <rect x="295" y="60" width="220" height="70" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="320" cy="80" r="14" fill="url(#stepGrad)"/>
  <text x="320" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
  <text x="345" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Generate certs</text>
  <text x="320" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">CA, API server, kubelet, etc.</text>

  <!-- Arrow -->
  <line x1="515" y1="95" x2="545" y2="95" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="545,89 557,95 545,101" fill="#cbd5e1"/>

  <!-- Step 3 -->
  <rect x="560" y="60" width="220" height="70" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="585" cy="80" r="14" fill="url(#stepGrad)"/>
  <text x="585" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
  <text x="610" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Generate kubeconfigs</text>
  <text x="585" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">admin, controller-mgr, scheduler</text>

  <!-- Arrow down -->
  <line x1="670" y1="130" x2="670" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="664,160 670,172 676,160" fill="#cbd5e1"/>

  <!-- Step 4 -->
  <rect x="560" y="175" width="220" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="585" cy="195" r="14" fill="#8b5cf6"/>
  <text x="585" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">4</text>
  <text x="610" y="197" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Static Pod manifests</text>
  <text x="585" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">API server, etcd, scheduler, CM</text>

  <!-- Arrow left -->
  <line x1="560" y1="210" x2="530" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="530,204 518,210 530,216" fill="#cbd5e1"/>

  <!-- Step 5 -->
  <rect x="295" y="175" width="220" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="320" cy="195" r="14" fill="#8b5cf6"/>
  <text x="320" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">5</text>
  <text x="345" y="197" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Start kubelet</text>
  <text x="320" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Launches static Pods</text>

  <!-- Arrow left -->
  <line x1="295" y1="210" x2="265" y2="210" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="265,204 253,210 265,216" fill="#cbd5e1"/>

  <!-- Step 6 -->
  <rect x="30" y="175" width="220" height="70" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="55" cy="195" r="14" fill="#8b5cf6"/>
  <text x="55" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="white">6</text>
  <text x="80" y="197" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Apply cluster config</text>
  <text x="55" y="225" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">ConfigMaps in kube-system</text>

  <!-- Arrow down -->
  <line x1="140" y1="245" x2="140" y2="275" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="134,275 140,287 146,275" fill="#cbd5e1"/>

  <!-- Step 7 - Output -->
  <rect x="30" y="290" width="750" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="60" cy="315" r="16" fill="#10b981"/>
  <text x="60" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">7</text>
  <text x="90" y="318" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#065f46">Output: join command for worker nodes</text>

  <text x="60" y="350" font-family="monospace" font-size="12" fill="#047857">kubeadm join 192.168.1.10:6443 --token abc123.xyz789 \</text>
  <text x="60" y="368" font-family="monospace" font-size="12" fill="#047857">    --discovery-token-ca-cert-hash sha256:abc123...</text>
  <text x="60" y="392" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="600">Save this! You need it for every worker node.</text>
</svg>
