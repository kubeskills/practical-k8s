<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Pod outer box -->
  <rect x="20" y="20" width="440" height="340" rx="16" fill="url(#podGrad)" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="240" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#92400e">Pod</text>

  <!-- Container 1 - App -->
  <rect x="50" y="70" width="170" height="120" rx="10" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="70" width="170" height="30" rx="10" fill="#3b82f6"/>
  <rect x="50" y="92" width="170" height="8" fill="#3b82f6"/>
  <text x="135" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Container (app)</text>
  <text x="135" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">nginx:latest</text>
  <text x="135" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Port 80</text>
  <text x="135" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">CPU: 100m, Mem: 128Mi</text>

  <!-- Container 2 - Sidecar -->
  <rect x="250" y="70" width="170" height="120" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="250" y="70" width="170" height="30" rx="10" fill="#8b5cf6"/>
  <rect x="250" y="92" width="170" height="8" fill="#8b5cf6"/>
  <text x="335" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Container (sidecar)</text>
  <text x="335" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">fluentd:latest</text>
  <text x="335" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Log collector</text>
  <text x="335" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">CPU: 50m, Mem: 64Mi</text>

  <!-- Shared network -->
  <rect x="50" y="210" width="370" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="235" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1e40af" font-weight="600">Shared Network Namespace</text>
  <text x="235" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">localhost communication  |  IP: 10.244.1.5</text>

  <!-- Shared volume -->
  <rect x="50" y="268" width="370" height="44" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
  <text x="235" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b21a8" font-weight="600">Shared Storage Volumes</text>
  <text x="235" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7c3aed">emptyDir, configMap, secret, PVC</text>

  <!-- Shared IPC -->
  <rect x="50" y="325" width="370" height="24" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="235" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">Shared IPC Namespace</text>

  <!-- Annotations on the right -->
  <g transform="translate(490, 80)">
    <rect x="0" y="0" width="190" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#334155">Key Facts</text>
    <line x1="20" y1="40" x2="170" y2="40" stroke="#e2e8f0" stroke-width="1"/>
    <text x="20" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Smallest deployable unit</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#475569">1+ containers per Pod</text>
    <text x="20" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Unique IP per Pod</text>
    <text x="20" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Containers share</text>
    <text x="20" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#475569">network + storage</text>
    <text x="20" y="202" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Ephemeral by design</text>
    <text x="20" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Managed by controllers</text>
    <text x="20" y="249" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">(Deployment, ReplicaSet)</text>
  </g>
</svg>
